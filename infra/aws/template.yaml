AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Makaan storage layer. Provisions the DynamoDB single table and the S3 evidence
  bucket used by the API adapters described in TECHNICAL.md. Compute deployment
  (Lambda adapter and the DynamoDB store implementation) is documented in
  infra/aws/README.md and is a deliberate follow-up so no broken handler is
  committed.

Parameters:
  WebOrigin:
    Type: String
    Default: https://example.com
    Description: Origin allowed to read and write evidence directly.

Resources:
  MakaanTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: makaan
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
        - AttributeName: gsi2pk
          AttributeType: S
        - AttributeName: gsi2sk
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: gsi2pk
              KeyType: HASH
            - AttributeName: gsi2sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  MakaanEvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'makaan-evidence-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
            AllowedOrigins:
              - !Ref WebOrigin
            MaxAge: 3000

Outputs:
  TableName:
    Description: DynamoDB single table for Makaan.
    Value: !Ref MakaanTable
  EvidenceBucketName:
    Description: S3 bucket for evidence originals.
    Value: !Ref MakaanEvidenceBucket
